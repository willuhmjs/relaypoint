name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Separate steps (instead of `npm run lint`) so a formatting failure
      # never masks lint findings.
      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relaypoint
          POSTGRES_DB: relaypoint
          # Trust auth: this is a throwaway CI database, so no password is set
          # and none appears in the connection URL below.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaypoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minio_access_key
          MINIO_ROOT_PASSWORD: minio_secret_key
        ports:
          - 9000:9000
        # The bucket is created by the Playwright global setup (with retries),
        # which is also what proves MinIO is ready to accept uploads.
        options: >-
          --entrypoint server
          -- "/data"
    env:
      DATABASE_URL: postgres://relaypoint@localhost:5432/relaypoint?schema=public
      AUTH_SECRET: 'ci_only_value_not_a_real_secret'
      AUTH_TRUST_HOST: 'true'
      AUTH_PROVIDERS: ''
      # No OAuth/OIDC provider is configured in CI, so local email/password
      # login auto-enables; the e2e suites authenticate with a seeded session
      # cookie (see e2e/global.setup.ts) instead.
      ORIGIN: http://localhost:4173
      APP_URL: http://localhost:4173
      PUBLIC_S3_ENDPOINT: http://localhost:9000
      PUBLIC_S3_BUCKET_NAME: relaypoint
      PUBLIC_S3_REGION: us-east-1
      S3_ACCESS_KEY: 'minio_access_key'
      S3_SECRET_KEY: 'minio_secret_key'
      BODY_SIZE_LIMIT: 10M
      MAX_UPLOAD_BYTES_MB: '10'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
