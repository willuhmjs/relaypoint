services:
  postgres:
    image: postgres:17
    restart: always
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  s3:
    image: minio/minio
    restart: always
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3-init:
    image: minio/mc
    depends_on:
      s3:
        condition: service_healthy
    env_file: .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://s3:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$PUBLIC_S3_BUCKET_NAME"
    restart: "no"

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    ports:
      - '3001:3000'

  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      s3:
        condition: service_healthy
      postgres:
        condition: service_started
      gotenberg:
        condition: service_started

volumes:
  postgres_data:
  s3_data: